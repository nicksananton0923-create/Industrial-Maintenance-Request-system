<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= include('Styles'); ?>
</head>
<body>
  <header>
    <h1>Industrial Maintenance System</h1>
    <div id="userBadge">Loading…</div>
  </header>

  <nav>
    <button data-tab="new" class="active">New Request</button>
    <button data-tab="list">Work Orders</button>
    <button data-tab="dash">Dashboard</button>
  </nav>

  <main>
    <section id="tab-new" class="tab active">
      <form id="requestForm">
        <label>Equipment Name *<input name="equipmentName" required></label>
        <label>Location<input name="location"></label>
        <label>Department<input name="department"></label>
        <label>Category *
          <select name="category" required>
            <option>Breakdown</option><option>Preventive</option>
            <option>Electrical</option><option>Mechanical</option>
            <option>HVAC</option><option>General</option>
          </select>
        </label>
        <label>Priority
          <select name="priority">
            <option>Low</option><option selected>Medium</option>
            <option>High</option><option>Critical</option>
          </select>
        </label>
        <label>Description *<textarea name="description" required></textarea></label>
        <button type="submit">Submit Request</button>
      </form>
      <div id="submitResult"></div>
    </section>

    <section id="tab-list" class="tab">
      <div class="filters">
        <input id="searchBox" placeholder="Search…">
        <select id="statusFilter">
          <option value="">All statuses</option>
          <option>Open</option><option>Assigned</option>
          <option>In Progress</option><option>Completed</option>
        </select>
        <button id="refreshList">Refresh</button>
      </div>
      <table id="requestsTable">
        <thead><tr>
          <th>WO ID</th><th>Equipment</th><th>Category</th><th>Priority</th>
          <th>Status</th><th>Assigned</th><th>Actions</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </section>

    <section id="tab-dash" class="tab">
      <div id="dashboard"></div>
    </section>
  </main>

  <?!= include('JavaScript'); ?>
</body>
</html>
