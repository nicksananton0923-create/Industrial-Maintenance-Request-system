<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; margin: 0; background: #f4f6f9; color: #222; }
  header { background: #1f4e78; color: #fff; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
  header h1 { margin: 0; font-size: 18px; }
  nav { display: flex; gap: 4px; padding: 8px 20px; background: #fff; border-bottom: 1px solid #ddd; }
  nav button { background: transparent; border: 1px solid transparent; padding: 8px 14px; cursor: pointer; border-radius: 4px; }
  nav button.active { background: #1f4e78; color: #fff; }
  main { padding: 20px; max-width: 1100px; margin: 0 auto; }
  .tab { display: none; }
  .tab.active { display: block; }
  form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; background: #fff; padding: 20px; border-radius: 8px; }
  form label { display: flex; flex-direction: column; font-size: 13px; gap: 4px; }
  form label:nth-child(6) { grid-column: span 2; }
  form textarea { min-height: 80px; resize: vertical; }
  form button { grid-column: span 2; padding: 10px; background: #1f4e78; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
  input, select, textarea { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font: inherit; }
  table { width: 100%; border-collapse: collapse; background: #fff; margin-top: 12px; }
  th, td { padding: 8px 10px; border-bottom: 1px solid #eee; text-align: left; font-size: 13px; }
  th { background: #eef2f7; }
  .filters { display: flex; gap: 8px; margin-bottom: 8px; }
  .filters input { flex: 1; }
  .card { background: #fff; padding: 16px; border-radius: 8px; margin-bottom: 12px; }
  .kpi { display: inline-block; min-width: 120px; padding: 12px; margin: 4px; background: #eef2f7; border-radius: 6px; text-align: center; }
  .kpi strong { display: block; font-size: 22px; color: #1f4e78; }
  .btn-sm { padding: 4px 8px; font-size: 12px; border: 1px solid #1f4e78; background: #fff; color: #1f4e78; border-radius: 3px; cursor: pointer; margin-right: 4px; }
  .btn-sm:hover { background: #1f4e78; color: #fff; }
  .badge { padding: 2px 8px; border-radius: 10px; font-size: 11px; }
  .badge.Open { background: #ffe4b5; } .badge.Assigned { background: #cfe2ff; }
  .badge.In\ Progress { background: #fff3cd; } .badge.Completed { background: #d1e7dd; }
</style>
