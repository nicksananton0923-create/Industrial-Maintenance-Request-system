<script>
let currentUser = null;

google.script.run.withSuccessHandler(u => {
  currentUser = u;
  document.getElementById('userBadge').textContent = `${u.name} (${u.role})`;
}).getCurrentUser();

document.querySelectorAll('nav button').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('nav button').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('tab-' + b.dataset.tab).classList.add('active');
    if (b.dataset.tab === 'list') loadList();
    if (b.dataset.tab === 'dash') loadDash();
  };
});

document.getElementById('requestForm').onsubmit = e => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target).entries());
  google.script.run
    .withSuccessHandler(r => {
      document.getElementById('submitResult').innerHTML =
        `<p style="color:green">Created <strong>${r.workOrderId}</strong>. Due: ${new Date(r.dueDate).toLocaleString()}</p>`;
      e.target.reset();
    })
    .withFailureHandler(err => {
      document.getElementById('submitResult').innerHTML =
        `<p style="color:red">${err.message}</p>`;
    })
    .submitRequest(data);
};

document.getElementById('refreshList').onclick = loadList;
document.getElementById('statusFilter').onchange = loadList;
document.getElementById('searchBox').oninput = debounce(loadList, 300);

function loadList() {
  const filter = {
    q: document.getElementById('searchBox').value,
    status: document.getElementById('statusFilter').value
  };
  google.script.run.withSuccessHandler(rows => {
    const tb = document.querySelector('#requestsTable tbody');
    tb.innerHTML = rows.map(r => `
      <tr>
        <td>${r.WorkOrderID}</td>
        <td>${r.EquipmentName || ''}</td>
        <td>${r.Category || ''}</td>
        <td>${r.Priority || ''}</td>
        <td><span class="badge ${r.Status}">${r.Status}</span></td>
        <td>${r.AssignedTechnician || '—'}</td>
        <td>
          ${r.Status === 'Assigned' ? `<button class="btn-sm" onclick="startJob('${r.WorkOrderID}')">Start</button>` : ''}
          ${r.Status === 'In Progress' ? `<button class="btn-sm" onclick="completeJob('${r.WorkOrderID}')">Complete</button>` : ''}
        </td>
      </tr>`).join('') || '<tr><td colspan="7">No records</td></tr>';
  }).listRequests(filter);
}

function startJob(id) {
  google.script.run.withSuccessHandler(loadList).startWork(id);
}

function completeJob(id) {
  const action = prompt('Action taken:'); if (action === null) return;
  const remarks = prompt('Remarks (optional):') || '';
  google.script.run.withSuccessHandler(loadList).completeWork(id, action, remarks, '', '');
}

function loadDash() {
  google.script.run.withSuccessHandler(d => {
    const kpi = (label, v) => `<div class="kpi"><strong>${v}</strong>${label}</div>`;
    document.getElementById('dashboard').innerHTML = `
      <div class="card">
        ${kpi('Open', d.open)}${kpi('Assigned', d.assigned)}
        ${kpi('In Progress', d.inProgress)}${kpi('Completed', d.completed)}
        ${kpi('Overdue', d.overdue)}
      </div>
      <div class="card">
        <h3>By Category</h3>
        <pre>${JSON.stringify(d.byCategory, null, 2)}</pre>
        <h3>Recurring Equipment (≥3 jobs)</h3>
        <pre>${JSON.stringify(d.recurring, null, 2)}</pre>
      </div>`;
  }).getDashboard();
}

function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
</script>
